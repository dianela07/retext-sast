name: Semgrep SAST
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  semgrep:
    name: Escaneo de seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      
      - name: Ejecutar Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
