name: Análisis SAST con Semgrep

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  analisis_seguridad:
    name: Escaneo de código en /retext
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio usando un hash SHA seguro (Equivalente a v4)
      - name: Obtener el código fuente
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 

      # 2. Instalar la herramienta Semgrep mediante pip
      - name: Instalar Semgrep
        run: python -m pip install --upgrade semgrep

      # 3. Ejecutar Semgrep SOLO en la carpeta 'retext' y generar el reporte JSON
      - name: Ejecutar análisis y generar métricas
        run: |
          semgrep scan \
            --config "p/default" \
            --json \
            --output reporte_sast.json \
            retext/
            
      # 4. Subir el reporte como un artefacto de GitHub (Equivalente a v4)
      # Esto te permite descargar el reporte_sast.json desde la pestaña "Actions"
      - name: Subir reporte de resultados
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3
        if: always() # Asegura que el reporte se suba incluso si Semgrep encuentra vulnerabilidades y falla el paso anterior
        with:
          name: metricas-semgrep-retext
          path: reporte_sast.json
