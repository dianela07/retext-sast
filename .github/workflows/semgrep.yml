name: Semgrep SAST
on: [push, pull_request]

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: Ejecutar Semgrep y generar SARIF
        # Ajusta "--config auto" si usas un archivo de reglas específico
        run: semgrep scan --config auto --sarif > semgrep-results.sarif
        continue-on-error: true # Evita que el pipeline falle inmediatamente para poder subir el reporte

      - name: Subir resultados a GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
